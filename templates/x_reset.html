{% extends 'base.html' %}{% block title %}Reset password{% endblock %}{% block content %}
<section class="x-wrap"><div class="container"><div class="x-head"><span class="overline">ACCOUNT</span><h1>{{ t('Reset password') }}</h1><p>Choose a new password with at least 10 characters.</p></div>
<form class="x-form x-card" method="post" action="/reset-password/{{ token }}" style="max-width:480px"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div><label for="p1">New password</label><input id="p1" name="password" type="password" minlength="10" required autocomplete="new-password"></div><div><label for="p2">Confirm password</label><input id="p2" name="confirm" type="password" minlength="10" required autocomplete="new-password"></div><button class="btn btn-primary" style="justify-self:start">Update password ↗</button></form></div></section>{% endblock %}
