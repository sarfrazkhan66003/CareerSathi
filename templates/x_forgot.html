{% extends 'base.html' %}{% block title %}Forgot password{% endblock %}{% block content %}
<section class="x-wrap"><div class="container"><div class="x-head"><span class="overline">ACCOUNT</span><h1>{{ t('Forgot password?') }}</h1><p>Enter your registered email. If it exists, we will send a reset link that works for one hour.</p></div>
<form class="x-form x-card" method="post" action="/forgot-password" style="max-width:480px"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div><label for="em">Email</label><input id="em" name="email" type="email" required autocomplete="email"></div><button class="btn btn-primary" style="justify-self:start">Send reset link ↗</button></form></div></section>{% endblock %}
