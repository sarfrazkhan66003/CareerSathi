{% extends 'base.html' %}{% block title %}FAQ{% endblock %}{% block content %}
<section class="x-wrap"><div class="container"><div class="x-head"><span class="overline">FAQ</span><h1>Questions, <em>answered.</em></h1></div><div style="max-width:820px">
{% for q,a in faq %}<details class="x-card" style="margin-bottom:12px"><summary style="font-weight:700;cursor:pointer">{{ q }}</summary><p style="margin-top:10px">{{ a }}</p></details>{% endfor %}</div></div></section>{% endblock %}
